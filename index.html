<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Toko - Layanan Pelanggan</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; height: 100vh; display: flex; flex-direction: column; }

    /* Topbar & Notifikasi */
    .topbar {
      background: #0f172a; color: #fff; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .badge-notif {
      background: #ef4444; color: #fff; font-size: 12px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
    }
    .toast-banner {
      background: #fef3c7; color: #92400e; border-bottom: 1px solid #fcd34d;
      padding: 8px 20px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    }

    /* Layout Utama */
    .app-container {
      flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0;
    }

    /* Sidebar Histori & Pencarian */
    .sidebar {
      background: #fff; border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column; min-height: 0;
    }
    .sidebar-header { padding: 14px; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 10px; }
    .btn-new {
      background: #2563eb; color: #fff; border: none; padding: 9px 12px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-new:hover { background: #1d4ed8; }
    .search-input {
      width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px;
    }
    .history-list { flex: 1; overflow-y: auto; }
    .history-item {
      padding: 12px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px;
    }
    .history-item:hover { background: #f8fafc; }
    .history-item.active { background: #eff6ff; border-left: 4px solid #2563eb; }
    .item-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
    .status-pill {
      font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 600;
    }
    .status-active { background: #dcfce7; color: #166534; }
    .status-ended { background: #e2e8f0; color: #475569; }
    .item-preview { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; }

    /* Area Chat */
    .chat-panel { display: flex; flex-direction: column; min-height: 0; background: #f8fafc; }
    .chat-header {
      background: #fff; padding: 12px 20px; border-bottom: 1px solid #e2e8f0;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .timer-box {
      font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 8px;
      background: #f1f5f9; color: #334155;
    }
    .timer-box.warning { background: #fee2e2; color: #991b1b; }
    .btn-end {
      background: #ef4444; color: #fff; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-sim {
      background: #0ea5e9; color: #fff; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    .messages-box {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
    .msg-customer { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; }
    .msg-agent { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg-system {
      align-self: center; background: #e2e8f0; color: #475569; font-size: 12px;
      padding: 6px 12px; border-radius: 999px;
    }
    .msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

    .chat-input-area {
      background: #fff; padding: 12px 20px; border-top: 1px solid #e2e8f0;
      display: flex; gap: 10px;
    }
    .chat-input {
      flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
    }
    .chat-input:disabled { background: #f1f5f9; cursor: not-allowed; }
    .btn-send {
      background: #16a34a; color: #fff; border: none; padding: 0 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .btn-send:disabled { background: #94a3b8; cursor: not-allowed; }

    @media (max-width: 768px) {
      .app-container { grid-template-columns: 1fr; grid-template-rows: 240px 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const IDLE_LIMIT_SECONDS = 180; // 3 menit = 180 detik
    const STORAGE_KEY = "cs_toko_sessions_v1";

    const INITIAL_SESSIONS = [
      {
        id: "CS-1001",
        customerName: "Rina Wijaya",
        status: "active", // "active" | "ended"
        lastActivityAt: Date.now() - 25 * 1000,
        unreadCount: 1,
        messages: [
          { id: "m1", sender: "customer", text: "Halo min, pesanan baju ukuran L saya apakah sudah dikirim?", time: "15:40" },
          { id: "m2", sender: "agent", text: "Halo Kak Rina, sebentar ya saya cek nomor resinya.", time: "15:41" },
          { id: "m3", sender: "customer", text: "Baik min, ditunggu kabarnya ya.", time: "15:42" }
        ]
      },
      {
        id: "CS-1002",
        customerName: "Budi Santoso",
        status: "ended",
        lastActivityAt: Date.now() - 3600 * 1000,
        unreadCount: 0,
        messages: [
          { id: "m4", sender: "customer", text: "Apakah bisa tukar size sepatu kalau kekecilan?", time: "14:10" },
          { id: "m5", sender: "agent", text: "Bisa Kak, maksimal 3 hari setelah barang diterima dengan kondisi tag masih ada.", time: "14:12" },
          { id: "m6", sender: "system", text: "Percakapan berakhir karena tidak ada aktivitas selama 3 menit.", time: "14:15" }
        ]
      }
    ];

    function formatTimeNow() {
      return new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    }

    function formatCountdown(sec) {
      const safe = Math.max(0, sec);
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // Notifikasi suara ringan tanpa file eksternal
    function playNotifSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (_) {}
    }

    function App() {
      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved); } catch (_) {}
        }
        return INITIAL_SESSIONS;
      });

      const [activeId, setActiveId] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : INITIAL_SESSIONS;
        return parsed[0]?.id || null;
      });

      const [searchQuery, setSearchQuery] = useState("");
      const [draftText, setDraftText] = useState("");
      const [toastMsg, setToastMsg] = useState("");
      const [nowTick, setNowTick] = useState(Date.now());
      const [soundEnabled, setSoundEnabled] = useState(true);
      const messagesEndRef = useRef(null);

      // Simpan histori ke localStorage
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      }, [sessions]);

      // Hitung total pesan belum dibaca & update judul tab browser
      const totalUnread = useMemo(
        () => sessions.reduce((acc, s) => acc + (s.unreadCount || 0), 0),
        [sessions]
      );

      useEffect(() => {
        document.title = totalUnread > 0 ? `(${totalUnread}) CS Toko - Pesan Baru` : "CS Toko - Layanan Pelanggan";
      }, [totalUnread]);

      // Interval 1 detik: update timer mundur & auto-end sesi aktif > 3 menit
      useEffect(() => {
        const interval = setInterval(() => {
          const currentNow = Date.now();
          setNowTick(currentNow);

          setSessions((prev) => {
            let changed = false;
            const next = prev.map((sess) => {
              if (sess.status === "active") {
                const elapsedSec = Math.floor((currentNow - sess.lastActivityAt) / 1000);
                if (elapsedSec >= IDLE_LIMIT_SECONDS) {
                  changed = true;
                  setToastMsg(`Sesi ${sess.id} (${sess.customerName}) otomatis berakhir karena 3 menit tanpa percakapan.`);
                  return {
                    ...sess,
                    status: "ended",
                    messages: [
                      ...sess.messages,
                      {
                        id: "sys-" + currentNow + "-" + sess.id,
                        sender: "system",
                        text: "Percakapan berakhir otomatis karena tidak ada aktivitas selama 3 menit.",
                        time: formatTimeNow()
                      }
                    ]
                  };
                }
              }
              return sess;
            });
            return changed ? next : prev;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, []);

      const activeSession = useMemo(
        () => sessions.find((s) => s.id === activeId) || null,
        [sessions, activeId]
      );

      // Auto-scroll ke pesan terbaru
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [activeSession?.messages?.length, activeId]);

      // Tandai pesan sudah dibaca saat memilih sesi
      const handleSelectSession = (id) => {
        setActiveId(id);
        setSessions((prev) =>
          prev.map((s) => (s.id === id ? { ...s, unreadCount: 0 } : s))
        );
      };

      // Kirim balasan dari CS (mereset timer 3 menit)
      const handleSendMessage = (e) => {
        e.preventDefault();
        const trimmed = draftText.trim();
        if (!trimmed || !activeSession || activeSession.status !== "active") return;

        const now = Date.now();
        const newMsg = {
          id: "msg-" + now,
          sender: "agent",
          text: trimmed,
          time: formatTimeNow()
        };

        setSessions((prev) =>
          prev.map((s) =>
            s.id === activeSession.id
              ? { ...s, messages: [...s.messages, newMsg], lastActivityAt: now }
              : s
          )
        );
        setDraftText("");
      };

      // Simulasi masuknya pesan baru dari pelanggan (untuk menguji notifikasi & reset timer)
      const handleSimulateCustomerMsg = () => {
        if (!activeSession || activeSession.status !== "active") return;
        const sampleReplies = [
          "Min, apakah ada promo ongkir hari ini?",
          "Oke siap, terima kasih banyak atas bantuannya!",
          "Boleh minta link produk warna hitamnya?",
          "Pengirimannya estimasi berapa hari ya?"
        ];
        const text = sampleReplies[Math.floor(Math.random() * sampleReplies.length)];
        const now = Date.now();
        const isCurrentView = activeSession.id === activeId;

        setSessions((prev) =>
          prev.map((s) =>
            s.id === activeSession.id
              ? {
                  ...s,
                  messages: [...s.messages, { id: "c-" + now, sender: "customer", text, time: formatTimeNow() }],
                  lastActivityAt: now,
                  unreadCount: isCurrentView ? 0 : (s.unreadCount || 0) + 1
                }
              : s
          )
        );

        setToastMsg(`Pesan baru dari ${activeSession.customerName}: "${text}"`);
        if (soundEnabled) playNotifSound();
      };

      // Akhiri percakapan secara manual
      const handleEndSession = () => {
        if (!activeSession || activeSession.status !== "active") return;
        setSessions((prev) =>
          prev.map((s) =>
            s.id === activeSession.id
              ? {
                  ...s,
                  status: "ended",
                  messages: [
                    ...s.messages,
                    {
                      id: "end-" + Date.now(),
                      sender: "system",
                      text: "Percakapan diakhiri oleh agen customer service.",
                      time: formatTimeNow()
                    }
                  ]
                }
              : s
          )
        );
      };

      // Buat percakapan baru
      const handleNewSession = () => {
        const name = prompt("Masukkan nama pelanggan:");
        if (!name || !name.trim()) return;
        const now = Date.now();
        const newId = "CS-" + String(Math.floor(1000 + Math.random() * 9000));
        const newSess = {
          id: newId,
          customerName: name.trim(),
          status: "active",
          lastActivityAt: now,
          unreadCount: 0,
          messages: [
            {
              id: "init-" + now,
              sender: "customer",
              text: "Halo admin, saya ingin bertanya tentang produk di toko.",
              time: formatTimeNow()
            }
          ]
        };
        setSessions((prev) => [newSess, ...prev]);
        setActiveId(newId);
        setToastMsg(`Percakapan baru dimulai bersama ${newSess.customerName} (${newId}).`);
        if (soundEnabled) playNotifSound();
      };

      // Filter histori berdasarkan nama, ID, atau isi pesan
      const filteredSessions = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return sessions;
        return sessions.filter((s) => {
          const matchMeta =
            s.customerName.toLowerCase().includes(q) ||
            s.id.toLowerCase().includes(q) ||
            s.status.toLowerCase().includes(q);
          const matchMsg = s.messages.some((m) => m.text.toLowerCase().includes(q));
          return matchMeta || matchMsg;
        });
      }, [sessions, searchQuery]);

      const remainingSeconds = activeSession && activeSession.status === "active"
        ? Math.max(0, IDLE_LIMIT_SECONDS - Math.floor((nowTick - activeSession.lastActivityAt) / 1000))
        : 0;

      return (
        <>
          <header className="topbar">
            <div className="topbar-left">
              <strong>CS Toko Dashboard</strong>
              <span className="badge-notif">Belum dibaca: {totalUnread}</span>
            </div>
            <button
              type="button"
              onClick={() => setSoundEnabled((v) => !v)}
              style={{
                background: "#1e293b", color: "#fff", border: "1px solid #475569",
                padding: "5px 10px", borderRadius: "6px", fontSize: "12px", cursor: "pointer"
              }}
            >
              {soundEnabled ? "Suara Notif: ON" : "Suara Notif: OFF"}
            </button>
          </header>

          {toastMsg && (
            <div className="toast-banner">
              <span><strong>Notifikasi:</strong> {toastMsg}</span>
              <button
                type="button"
                onClick={() => setToastMsg("")}
                style={{ background: "none", border: "none", fontWeight: 700, cursor: "pointer", color: "#92400e" }}
              >
                Tutup
              </button>
            </div>
          )}

          <main className="app-container">
            {/* Panel Kiri: Pencarian & Histori Percakapan */}
            <aside className="sidebar">
              <div className="sidebar-header">
                <button type="button" className="btn-new" onClick={handleNewSession}>
                  + Percakapan Baru
                </button>
                <input
                  type="text"
                  className="search-input"
                  placeholder="Cari nama, ID, atau isi chat..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                />
              </div>

              <div className="history-list">
                {filteredSessions.length === 0 ? (
                  <div style={{ padding: 20, fontSize: 13, color: "#64748b", textAlign: "center" }}>
                    Histori percakapan tidak ditemukan.
                  </div>
                ) : (
                  filteredSessions.map((sess) => {
                    const lastMsg = sess.messages[sess.messages.length - 1];
                    return (
                      <div
                        key={sess.id}
                        className={`history-item ${sess.id === activeId ? "active" : ""}`}
                        onClick={() => handleSelectSession(sess.id)}
                      >
                        <div className="item-top">
                          <span>
                            {sess.customerName}{" "}
                            {sess.unreadCount > 0 && (
                              <span className="badge-notif">{sess.unreadCount}</span>
                            )}
                          </span>
                          <span className={`status-pill ${sess.status === "active" ? "status-active" : "status-ended"}`}>
                            {sess.status === "active" ? "Aktif" : "Selesai"}
                          </span>
                        </div>
                        <div className="item-preview">
                          {lastMsg ? lastMsg.text : "Belum ada pesan"}
                        </div>
                        <div className="item-meta">
                          <span>{sess.id}</span>
                          <span>{lastMsg?.time || "-"}</span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </aside>

            {/* Panel Kanan: Ruang Obrolan & Timer 3 Menit */}
            <section className="chat-panel">
              {activeSession ? (
                <>
                  <div className="chat-header">
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>
                        {activeSession.customerName} <span style={{ fontWeight: 400, color: "#64748b", fontSize: 12 }}>({activeSession.id})</span>
                      </div>
                      <div style={{ fontSize: 12, color: "#64748b" }}>
                        Status: {activeSession.status === "active" ? "Sedang berlangsung" : "Percakapan berakhir"}
                      </div>
                    </div>

                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      {activeSession.status === "active" && (
                        <>
                          <div className={`timer-box ${remainingSeconds <= 30 ? "warning" : ""}`}>
                            Auto-end: {formatCountdown(remainingSeconds)}
                          </div>
                          <button type="button" className="btn-sim" onClick={handleSimulateCustomerMsg}>
                            Simulasi Chat Pelanggan
                          </button>
                          <button type="button" className="btn-end" onClick={handleEndSession}>
                            Akhiri Sesi
                          </button>
                        </>
                      )}
                    </div>
                  </div>

                  <div className="messages-box">
                    {activeSession.messages.map((msg) =>
                      msg.sender === "system" ? (
                        <div key={msg.id} className="msg-system">
                          {msg.text} ({msg.time})
                        </div>
                      ) : (
                        <div
                          key={msg.id}
                          className={`msg ${msg.sender === "agent" ? "msg-agent" : "msg-customer"}`}
                        >
                          <div>{msg.text}</div>
                          <div className="msg-time">{msg.time}</div>
                        </div>
                      )
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  <form className="chat-input-area" onSubmit={handleSendMessage}>
                    <input
                      type="text"
                      className="chat-input"
                      placeholder={
                        activeSession.status === "active"
                          ? "Tulis balasan untuk pelanggan..."
                          : "Percakapan telah berakhir. Mulai percakapan baru di panel kiri."
                      }
                      value={draftText}
                      onChange={(e) => setDraftText(e.target.value)}
                      disabled={activeSession.status !== "active"}
                    />
                    <button
                      type="submit"
                      className="btn-send"
                      disabled={activeSession.status !== "active" || !draftText.trim()}
                    >
                      Kirim
                    </button>
                  </form>
                </>
              ) : (
                <div style={{ margin: "auto", color: "#64748b", fontSize: 14 }}>
                  Pilih histori percakapan di sebelah kiri atau buat percakapan baru.
                </div>
              )}
            </section>
          </main>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
